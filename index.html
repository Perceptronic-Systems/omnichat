<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>omnichat</title>
    <link id="theme-stylesheet" rel="stylesheet" href="/themes/default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

      window.Prism = window.Prism || {};
      window.Prism.plugins = window.Prism.plugins || {};

        languages_path: 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/'
      };
    </script>
    
    <!-- Autoloader Plugin -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <!-- Preload Python & common extra languages directly -->

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
