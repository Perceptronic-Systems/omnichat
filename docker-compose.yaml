services:
  omnichat-backend:
    build: .
    container_name: omnichat-backend
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=http://ollama-service:11434
      - OLLAMA_KEEP_ALIVE=-1
      - VOSK_MODEL_PATH=/models/vosk-model-small-en-us-0.15
      - PYTHONUNBUFFERED=1
      - HF_HOME=/root/.cache/huggingface
    networks:
      - omnichat_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/omnichat:/etc/omnichat
      - ./models/vosk-model-small-en-us-0.15:/models/vosk-model-small-en-us-0.15:ro
      - huggingface_cache:/root/.cache/huggingface

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - omnichat_net

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./omnichat-nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/tailscale-certs:/etc/ssl/tailscale-certs:ro
    networks:
      - omnichat_net

volumes:
  ollama_data:
  huggingface_cache:

networks:
  omnichat_net:
    driver: bridge
    name: omnichat_net
